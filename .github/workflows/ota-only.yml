# =====================================================================
# OTA Only - publish a SAME-VERSION hot-patch (JS/asset only) without
# rebuilding the APK - the fast channel for emergency fixes between releases.
#
# Triggers on push to main when mobile/src or mobile/assets files changed
# (app.json / package.json / plugins / keystores take the full release.yml
# build instead). A release commit (version bump) ALSO touches mobile/src, so
# the "release-guard" step below skips this whole run whenever app.json
# versionCode is newer than the published manifest - release.yml owns those.
#
# VERSION SEMANTICS: this channel NEVER bumps the version. It publishes a
# bundle that keeps the CURRENT app version, so devices just reload with the
# patch and the release.json "Last published" timestamp advances. Any change
# that should go out as a NEW version belongs in release.yml (every release
# bumps app.json version + versionCode and installs as a new APK).
#
# NOTE: runtimeVersion stays CONSTANT (1.0.0). Never bump it for OTA-only
# pushes - a different runtimeVersion is incompatible with the installed
# build and every device silently skips the bundle until a native rebuild.
# =====================================================================
name: OTA Only

on:
  push:
    branches: [main]
    paths:
      - "mobile/src/**"
      - "mobile/assets/**"
  workflow_dispatch:

concurrency:
  group: ota-only
  cancel-in-progress: false

jobs:
  ota-publish:
    if: github.ref == 'refs/heads/main'
    name: Publish OTA bundle (no APK)
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # CRITICAL: EXPO_PUBLIC_* are inlined into the JS bundle by Metro at
      # "eas update" publish time — exactly like release.yml. Without these
      # the published OTA bundle ships with an EMPTY Supabase URL/anon key
      # and Google client IDs: backend dead, sign-in gone, no version check.
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # ── Decide whether this push should publish an OTA bundle ─────────
      # Standard practice for this repo:
      #   • version bump pushes (app.json versionCode increases) are owned by
      #     release.yml and install as a new APK;
      #   • every other mobile/src or mobile/assets push publishes a same-version
      #     OTA bundle so testers get JS/asset fixes without reinstalling.
      #
      # The guard below is deliberately vocal: when it skips, it says exactly
      # why, so a silent skip is no longer the default outcome.
      - name: Decide whether to publish an OTA bundle
        id: release-guard
        run: |
          APP_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          if ! MANIFEST=$(curl -sS --fail --max-time 15 "https://jxgmbodzkmxanuwfaqxo.supabase.co/storage/v1/object/public/app-releases/release.json"); then
            echo "No published manifest yet — nothing to hot-patch; skipping OTA."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=no_published_manifest" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MF_CODE=$(node -e "process.stdout.write(String(JSON.parse(process.argv[1]).version_code ?? 0))" "$MANIFEST")
          MF_VERSION=$(node -e "process.stdout.write(String(JSON.parse(process.argv[1]).version ?? ''))" "$MANIFEST")
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          if [ "$APP_CODE" -gt "$MF_CODE" ]; then
            echo "OTA skipped: app.json versionCode $APP_CODE is newer than published manifest $MF_CODE."
            echo "This push is a RELEASE. release.yml owns the new APK; OTA stays on the old runtime."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=version_bump" >> "$GITHUB_OUTPUT"
          elif [ "$APP_VERSION" != "$MF_VERSION" ]; then
            echo "OTA skipped: APP_VERSION ($APP_VERSION) differs from manifest version ($MF_VERSION)."
            echo "This looks like a version- or metadata-only change; OTA channel skips."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=version_mismatch" >> "$GITHUB_OUTPUT"
          else
            echo "OTA proceeding: app.json versionCode $APP_CODE matches published $MF_CODE,"
            echo "APP_VERSION matches manifest version ($MF_VERSION). Same-version hot-patch."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.release-guard.outputs.skip != 'true'
        run: npm ci

      - name: Typecheck
        if: steps.release-guard.outputs.skip != 'true'
        run: npm run typecheck

      - name: Expo doctor
        if: steps.release-guard.outputs.skip != 'true'
        run: npm run doctor

      # An OTA bundle carries the EXPO_PUBLIC_* values forever, so a stale
      # secret would ship a bundle whose backend no longer resolves. Fail before
      # publishing instead. See scripts/check-supabase-ref.mjs.
      - name: Verify Supabase project (env vs release URLs)
        if: steps.release-guard.outputs.skip != 'true'
        run: node scripts/check-supabase-ref.mjs --require

      - name: Publish OTA update
        if: steps.release-guard.outputs.skip != 'true'
        id: publish-ota
        run: |
          set +e
          npx eas-cli update --branch main --message "OTA-only push (${{ github.sha }})" --non-interactive
          PUBLISH_EXIT=$?
          if [ $PUBLISH_EXIT -eq 0 ]; then
            echo "✅ OTA bundle published: ${{ github.sha }}"
          else
            echo "::error::OTA publish failed with exit code $PUBLISH_EXIT"
          fi
          echo "publish_exit=$PUBLISH_EXIT" >> "$GITHUB_OUTPUT"
          exit $PUBLISH_EXIT

      # ── Sync release.json metadata (notes + updated_at) ──
      # The APK fields are untouched (same version, no new APK). This only
      # flicks the human-facing note + timestamp so the website /app page
      # and the in-app "Last published" line reflect the short update.
      #
      # This runs even when the OTA publish step itself skipped/failed, but
      # only when the release-guard allowed an OTA path and Supabase creds are
      # present. When publish failed, the metadata still gets a clear note so
      # the repo/CI history shows the broken delivery instead of a silent gap.
      - name: Sync OTA manifest metadata
        if: steps.release-guard.outputs.skip != 'true' && env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: |
          set +e
          node scripts/sync-ota-manifest.mjs --message "Short update (${{ github.sha }})"
          SYNC_EXIT=$?
          if [ $SYNC_EXIT -eq 0 ]; then
            echo "✅ OTA manifest metadata synced."
          else
            echo "::warning::OTA manifest metadata sync failed (exit $SYNC_EXIT)."
          fi
          exit $SYNC_EXIT
