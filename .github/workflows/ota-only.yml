# =====================================================================
# OTA Only - publish JS/asset updates without building the APK.
#
# Triggers on push to main when ONLY mobile/src or mobile/assets files
# changed (app.json / package.json / plugins / keystores / workflow edits
# take the full release.yml build instead).
# Skips the APK build entirely (~15 min saved).
# Runs typecheck + expo-doctor + publishes OTA bundle (~2-5 sec), then
# syncs the release.json metadata (notes + updated_at) so the website
# /app page and the in-app updater instantly show the short update.
#
# NOTE: runtimeVersion stays CONSTANT (1.0.0). Never bump it for OTA-only
# pushes - a different runtimeVersion is incompatible with the installed
# build and every device silently skips the bundle until a native rebuild.
# =====================================================================
name: OTA Only

on:
  push:
    branches: [main]
    paths:
      - 'mobile/src/**'
      - 'mobile/assets/**'
  workflow_dispatch:

concurrency:
  group: ota-only
  cancel-in-progress: false

jobs:
  ota-publish:
    if: github.ref == 'refs/heads/main'
    name: Publish OTA bundle (no APK)
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Expo doctor
        run: npm run doctor

      # ── Publish OTA bundle (JS/asset only) ──────────────
      # OTA bundles are delivered by Expo's servers and apply on next app
      # load. They keep the SAME app version - no APK is rebuilt.
      - name: Publish OTA update
        run: npx eas-cli update --branch main --message "OTA-only push (${{ github.sha }})" --non-interactive

      # ── Sync release.json metadata (notes + updated_at) ──
      # The APK fields are untouched (same version, no new APK). This only
      # flicks the human-facing note + timestamp so the website /app page
      # and the in-app "Last published" line reflect the short update.
      - name: Sync OTA manifest metadata
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: node scripts/sync-ota-manifest.mjs --message "Short update (${{ github.sha }})"
        continue-on-error: true