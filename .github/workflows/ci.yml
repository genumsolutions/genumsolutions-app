name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck + Expo doctor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      # Full history required: gitleaks-action resolves the pushed commit
      # range (BASE^..HEAD), which fails on a shallow clone (git exit 128).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Expo doctor
        run: npm run doctor

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Layout smoke test — typecheck and vitest prove what the SOURCE says;
  # this renders the exported bundle in Chromium at 390x844 and looks at it.
  # It exists because two real defects passed every other check: a training
  # title clamped to "K–5 Ro…" and a card title to "Robotics Lab Consul…".
  e2e:
    name: Layout smoke (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # No .env.local in CI, so the bundle keeps the placeholder Supabase host:
      # every read fails fast and the screens paint their bundled content. That
      # is why the assertions only target strings true with or without a DB.
      - name: Export web bundle
        run: npx expo export --platform web

      - name: Layout smoke test
        run: npx playwright test

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: mobile/test-results
          retention-days: 7
          if-no-files-found: ignore

  # App-vs-website parity. The app is a mirror of the public website, so this
  # job renders BOTH surfaces side by side in one Playwright run and diffs
  # them. It needs the website repo, which the e2e job above does not have —
  # hence a separate job that checks out both repos.
  #
  # With no credentials both surfaces serve the same bundled catalog (the app
  # ships a generated copy of the website's), so this job compares the real
  # numbers too: 55 / 0 / 0 / 7 on both. It also checks the Home program band
  # order and that every Services training program, pilot line item/cost and
  # curriculum band the website lists exists in the app.
  parity:
    name: App vs website (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout app
        uses: actions/checkout@v5

      # Public repo, so the job's default token can clone it.
      - name: Checkout website
        uses: actions/checkout@v5
        with:
          repository: genumsolutions/genumsolutions-website
          path: website

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            website/package-lock.json

      - name: Install app dependencies
        working-directory: mobile
        run: npm ci

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      # next dev compiles on demand and needs no build step. Credentials are
      # placeholders: lib/supabase refuses to construct a client without a
      # URL, and the pages then paint their bundled content.
      - name: Start website
        working-directory: website
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
        run: |
          nohup npm run dev > "$RUNNER_TEMP/website.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/about; then
              echo "website ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "website never became ready:"; tail -40 "$RUNNER_TEMP/website.log"; exit 1

      # The bundled catalog is generated from the website's fallback catalog,
      # so it drifts silently the moment the website catalog changes. Rebuild
      # it against the checked-out website and fail if the committed copy
      # differs — the fix is to run the generator locally and commit.
      - name: Bundled catalog is current
        working-directory: mobile
        run: |
          npx --yes tsx scripts/generate-bundled-catalog.mts --website ../website
          if ! git diff --quiet -- src/config/bundledProducts.ts; then
            echo "::error::src/config/bundledProducts.ts is stale — run 'npx tsx scripts/generate-bundled-catalog.mts' from mobile/ (website as a sibling) and commit the result."
            git diff --stat -- src/config/bundledProducts.ts
            exit 1
          fi
          echo "bundled catalog matches the website"

      - name: Install Chromium
        working-directory: mobile
        run: npx playwright install --with-deps chromium

      - name: Export web bundle
        working-directory: mobile
        run: npx expo export --platform web

      - name: Compare app against website
        working-directory: mobile
        env:
          WEBSITE_URL: http://127.0.0.1:3000
        run: npx playwright test website-parity

      - name: Website server log
        if: always()
        run: tail -60 "$RUNNER_TEMP/website.log" 2>/dev/null || true

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: mobile/test-results
          retention-days: 7
          if-no-files-found: ignore
