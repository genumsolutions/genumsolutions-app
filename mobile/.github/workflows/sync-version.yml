# =====================================================================
# Auto-sync app version to Supabase when app.json changes.
#
# This pushes the release.json manifest to the public Supabase bucket
# so the website /app page and the native in-app update checker always
# show the latest version without manual intervention.
# =====================================================================
name: Sync app version

on:
  push:
    branches: [main]
    paths:
      - 'app.json'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync version manifest to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-version.mjs
