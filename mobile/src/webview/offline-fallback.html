<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GENUM IoT & Remote - Offline Mode</title>
  <style>
    :root {
      --mist: #f3f4f6;
      --navy: #1e293b;
      --accent: #3b82f6;
      --gold: #d97706;
      --surface: #ffffff;
      --ink: #1e293b;
      --text-navy: #334155;
      --text-ink: #0f172a;
      --border-line: #e2e8f0;
      --border-accent: #3b82f6;
    }

    html {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--mist);
      color: var(--ink);
    }

    body {
      margin: 0;
      padding: 20px;
    }

    .header {
      background: var(--navy);
      color: white;
      padding: 20px 30px;
      border-radius: 12px 12px 0 0;
      margin: -20px -20px 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    .header p {
      margin: 5px 0 0;
      opacity: 0.8;
      font-size: 0.875rem;
    }

    .mode-grid {
      max-width: 600px;
      margin: 0 auto;
    }

    .mode-card {
      background: white;
      border: 1px solid var(--border-line);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }

    .mode-card:hover {
      border-color: var(--accent);
    }

    .mode-card.active {
      border-color: var(--accent);
      background: #eff6ff;
    }

    .mode-name {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 8px;
      display: block;
    }

    .mode-token {
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 12px;
      display: block;
    }

    .mode-blurb {
      font-size: 0.875rem;
      color: #64748b;
      line-height: 1.4;
    }

    .control-buttons {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
    }

    .btn {
      background: var(--navy);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.875rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn.secondary {
      background: var(--mist);
      color: var(--navy);
    }

    .status-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--navy);
      color: white;
      padding: 8px 20px;
      font-size: 0.75rem;
      text-align: center;
    }

    .offline-indicator {
      background: var(--gold);
      color: var(--navy);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.67rem;
      font-weight: 600;
      margin-left: 10px;
    }
  </style>
</head>

<body>
  <div class="header">
    <h1>GENUM IoT & Remote</h1>
    <p>Offline Mode — Car modes from local catalogue</p>
    <span class="offline-indicator">OFFLINE</span>
  </div>

  <div class="mode-grid">
    {modeData.map((mode) => (
      <div
        key={mode.id}
        className="mode-card"
          {activeMode?.id === mode.id ? 'active' : ''}
      >
        <div class="mode-name">{mode.name}</div>
        <div class="mode-token">Token: {mode.token}</div>
        <div class="mode-blurb">{mode.blurb}</div>
        <div class="control-buttons">
          <button class="btn" onClick={() => selectMode(mode.id)}>Select</button>
          <button class="btn secondary" onClick={() => window.postMessage({ type: 'genum:robo', payload: { token: mode.token } }, '*')}">Send</button>
        </div>
      </div>
    ))}
  </div>

  <div class="status-bar">
    Car modes loaded from local catalogue. Connect to vehicle BLE/WiFi for control.
  </div>

  <script>
    // Handle mode selection
    window.selectMode = function(modeId) {
      // Find the mode data and post message
      var mode = modeData.find(function(m) { return m.id === modeId; });
      if (mode) {
        window.ReactNativeWebView?.postMessage(JSON.stringify({
          type: 'genum:mode',
          payload: { token: mode.token }
        }));
      }
    };

    // Handle window load to get mode data
    window.modeData = {modeData};
  </script>
</body>
</html>
